services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oratoria
      POSTGRES_PASSWORD: oratoria
      POSTGRES_DB: oratoria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oratoria -d oratoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "src.oratoria.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.oratoria.workers.celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./src:/app/src

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.oratoria.workers.celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./src:/app/src

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: ["celery", "-A", "src.oratoria.workers.celery_app", "flower", "--port=5555"]

volumes:
  postgres_data:
  redis_data:
